<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Gradiente do Swoosh Superior: azul (#0B5AA8) -> teal (#12789E) -> verde (#2E9E43) -> verde-amarelo (#7EBE32) -> amarelo (#FCD200) -->
    <linearGradient id="fav-delfos-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0B5AA8" />
      <stop offset="25%" stopColor="#12789E" />
      <stop offset="50%" stopColor="#2E9E43" />
      <stop offset="78%" stopColor="#7EBE32" />
      <stop offset="100%" stopColor="#FCD200" />
    </linearGradient>

    <!-- Gradiente do Swoosh Inferior: amarelo (#FCD200) -> dourado (#DECA09) -> verde (#2E9E43) -> azul (#0B5AA8) -->
    <linearGradient id="fav-delfos-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FCD200" />
      <stop offset="22%" stopColor="#DECA09" />
      <stop offset="55%" stopColor="#2E9E43" />
      <stop offset="82%" stopColor="#12789E" />
      <stop offset="100%" stopColor="#0B5AA8" />
    </linearGradient>
  </defs>

  <!-- Fundo sutilmente arredondado para contraste em abas claras e escuras -->
  <rect width="64" height="64" rx="14" fill="#FFFFFF" />

  <!-- Swoosh Superior em Arco Elíptico -->
  <path
    d="M 6 22 C 12 11, 22 5, 32 5 C 44 5, 54 11, 58 20 C 51 12, 42 8, 32 8 C 21 8, 12 13, 6 22 Z"
    fill="url(#fav-delfos-top)"
  />

  <!-- Swoosh Inferior em Arco Elíptico -->
  <path
    d="M 6 42 C 12 51, 21 57, 32 57 C 43 57, 52 51, 58 44 C 52 53, 42 60, 32 60 C 20 60, 11 53, 6 42 Z"
    fill="url(#fav-delfos-bottom)"
  />

  <!-- Letra 'd' emblemática central da Delfos em azul institucional -->
  <text
    x="32"
    y="42"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="34"
    font-weight="900"
    fill="#0A539E"
  >d</text>
</svg>
